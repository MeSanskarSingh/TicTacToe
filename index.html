<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="indexstyle.css">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet">
</head>

<body>
    <h1>TIC TAC TOE</h1>
    <div class="formout">
        <div class="formcont">
            <div>
                <p>Player 'X'</p>
                <input placeholder="Enter name" class="inputbox" id="playerX">
            </div>
            <div>
                <p>Player 'O'</p>
                <input placeholder="Enter name" class="inputbox" id="playerO">
            </div>
            <button onclick="startGame()">START!</button>
        </div>
    </div>

    <p id="subscript">Created by Sanskar Singh (Github: @MeSanskarSingh)</p>

    <script src="index_js.js"></script>
</body>
</html>
